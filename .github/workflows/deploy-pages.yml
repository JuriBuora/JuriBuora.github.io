name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [my-blog]
  # Posts dated in the future stay hidden until their day, and Jekyll only
  # notices that the day has come when it builds. So build in the morning.
  # GitHub runs schedules on a best-effort basis and may skip them, so these
  # two slots are a bonus, not the guarantee: a job on the author's Mac
  # (scripts/release-due-posts.py in the juribuora-cyber-site repository)
  # checks that the day's posts are listed and starts this workflow if not.
  schedule:
    - cron: "13 4 * * *"
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
